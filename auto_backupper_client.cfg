# ==============================================================================
# AUTO-BACKUPPER-CLIENT CONFIGURATION FILE
# ==============================================================================
# Loaded (sourced) by auto-backupper-client.sh -- the Linux/macOS desktop
# backup client. Bash syntax, same as the rest of the suite's config. Default
# save location (override with --config):
#   Linux: /etc/auto-backupper/auto_backupper_client.cfg
#   macOS: /Library/Application Support/auto-backupper/auto_backupper_client.cfg
# ==============================================================================

# --- IDENTITY ---
# The <member> directory under shares/FamilyBackups/<member>/ on the server.
# Empty = the UPPERCASE short hostname. Set this to match the existing
# FamilyBackups/<computer> folder you already use for this machine, and keep the
# casing consistent across runs (a case-variant creates a parallel tree the
# server cannot reconcile).
MEMBER_NAME=""

# --- EXECUTION ---
DRY_RUN="false"                  # "true" to simulate (no writes/deliveries)
LOG_VERBOSITY="info"             # error | phase | info | debug

# --- WHAT TO BACK UP ---
BACKUP_USERS="true"              # produce the USER-data archive
BACKUP_SYSTEM="true"             # produce the SYSTEM-state archive
INCLUDE_ALL_USERS="false"        # "true" backs up every local account (needs root)

# Users / home paths to include. Empty = auto-detect. Entries may be usernames
# or absolute home paths.
USERS_INCLUDE=()

# Per-user subfolders (relative to each home). Empty = per-OS defaults
# (macOS: Documents/Desktop/Pictures/Movies/Music/Downloads/Library/Preferences/
#  Library/Application Support; Linux: the whole home minus caches/Trash).
USER_INCLUDE_FOLDERS=()

# Extra exclusion globs (appended to the per-OS defaults). tar --exclude syntax,
# matched against the ./-rooted archive member path.
EXCLUDES=(
  "*/node_modules/*"
)

# Extra absolute system paths to fold into the SYSTEM archive (optional).
SYSTEM_EXTRA_PATHS=()

# macOS/Linux: keep real uid/gid/mode in the archive (tar does this natively).
PRESERVE_POSIX_META="true"

# --- DESTINATIONS (index-aligned arrays; the client delivers to EACH) ---
# DEST_TYPES[i]: local | share | rsync_ssh
# DEST_PATHS[i]: for local/share, the server BACKUP_BASE (the client appends
#               shares/FamilyBackups/<MEMBER>/... and .checksums/... itself).
DEST_NAMES=( "usb"                 "nas"                 )
DEST_TYPES=( "local"               "share"               )
DEST_PATHS=( "/mnt/backup"         "/mnt/nas/backup"     )

# rsync-over-SSH push (warphole-style, typically over Tailscale). Used by a
# DEST_TYPES entry of "rsync_ssh"; RSYNC_SSH_TARGET is the server BACKUP_BASE.
RSYNC_SSH_TARGET=""              # e.g. backup@homeserver:/mnt/user/backup
RSYNC_SSH_IDENTITY=""            # e.g. /etc/auto-backupper/id_ed25519
RSYNC_SSH_PORT="22"

# --- SERVER TREE (for --list / restore fetch-back) ---
SERVER_BACKUP_BASE=""            # a mounted path to the server BACKUP_BASE, if reachable

# --- LOCAL STAGING ---
STAGING_DIR=""                   # empty = OS temp dir + /auto-backupper-staging

# --- RETENTION ---
# The SERVER owns retention; the client only trims local/share copies.
LOCAL_KEEP="2"                   # local/share data copies to retain (0 = keep all)
ROTATE_DAYS="0"                  # 0 = never rotate at the client

# --- VERIFY ---
VERIFY_AFTER_CREATE="true"       # re-hash each delivered archive vs its checksum
VERIFY_BEFORE_RESTORE="true"     # refuse to restore a checksum-mismatched archive

# --- SCHEDULE (consumed by --install-schedule) ---
SCHEDULE_CADENCE="daily"         # daily | weekly
SCHEDULE_TIME="02:30"            # HH:MM local
SCHEDULE_DAY="Sunday"            # weekly only
SCHEDULE_WAKE="true"             # wake / catch missed runs where supported

# --- COMPRESSION ---
CPU_THREADS="1"                  # "all" | "1" | "4" ... (pigz threads if pigz present)

# --- NOTIFICATIONS (optional) ---
NOTIFY_WEBHOOK_URL=""            # Discord/Slack/ntfy/generic webhook
NOTIFY_WEBHOOK_FORMAT=""         # discord | slack | generic (auto if empty)
