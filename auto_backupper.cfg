# ==============================================================================
# AUTO-BACKUPPER CONFIGURATION FILE
# ==============================================================================
# This file is loaded by /usr/local/bin/auto_backupper.sh AND watchtower
# Save location: /boot/config/auto_backupper.cfg
# --- EXECUTION SETTINGS ---
# "produce" = Create local backups
# "pull"    = Sync from remote (Additive only)
# "both"    = Produce then Pull
MODE="both"
# --- PERFORMANCE SETTINGS  ---
# "all" = Use all cores
# "1"   = Disable Multi-threading
# "4"   = Limit to 4 threads, 
# etc...
CPU_THREADS="all"
# Set to "false" for production execution
DRY_RUN="true"
# --- SYSTEM PATHS ---
BACKUP_BASE="/mnt/user/backup"
SHARES_BASE_FOLDER="/mnt/user"
SYSTEM_APPDATA_PATH="/mnt/cache/appdata"
SYSTEM_BOOT_PATH="/boot"
# --- Docker Strategy ---
# "auto"           : Detects OS. But Can be forced to "unraid_service", "container", "disabled" below...
# "unraid_service" : Uses /etc/rc.d/rc.docker (Stop -> Wait -> Unmount Img -> Force Stop).
# "container"      : Stops specific containers (Stop -> Wait -> Kill).
# "disabled"       : Backups run hot.
DOCKER_MODE="unraid_service"
DOCKER_STOP_TIMEOUT=256
# --- UNRAID SPECIFIC SETTINGS ---
# Should we read Unraid's official /boot/config/docker.cfg? (Recommended: true)
USE_UNRAID_DOCKER_CFG=true
UNRAID_DOCKER_CFG="/boot/config/docker.cfg"
# Should the docker.img file be included in the unraid system backup?
BACKUP_DOCKER_IMG=true
# Fallback values if docker.cfg is unreadable
DOCKER_IMG_PATH="/mnt/cache/system/docker/docker.img"
DOCKER_IMG_SIZE="100" # Size is in GB
# --- OMV Clone Path ---
# If set, this folder is rsynced instead of creating a tar of SYSTEM_APPDATA_PATH
OMV_DOCKER_BACKUP_PATH=""
# --- Retention & Integrity ---
ROTATE_DAYS=90                 # Days to keep files (0 = forever)
VERIFY_LOCAL_BACKUPS=true      # Checksum verify after create
VERIFY_PULLED_BACKUPS=true     # Checksum verify after pull
# --- BACKUP TOGGLES ---
BACKUP_SYSTEM=true
BACKUP_SHARES=true
# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION
# ------------------------------------------------------------------------------
# --- SQL (MariaDB/MySQL/Postgres) ---
BACKUP_SQL=false
SQL_TYPE="mysql"              # 'mysql' or 'postgres'
SQL_CONTAINER_NAME="mariadb"  # Container Name (or "" for Host)
SQL_HOST="172.18.0.4"         # Host IP (used if Container Name is empty)
SQL_USER="root"
SQL_PASS="MYSQLPASS"
SQL_DATABASES=()              # Leave empty for ALL databases
# --- Mongo ---
BACKUP_MONGO=false
MONGO_CONTAINER_NAME="mongodb"
MONGO_USER="root"
MONGO_PASS="YourMongoPassword"
MONGO_AUTH_DB="admin"
MONGO_DATABASES=()
# --- Redis ---
BACKUP_REDIS=false
REDIS_CONTAINER_NAME="redis"
REDIS_PASS=""
# ------------------------------------------------------------------------------
# SHARES CONFIGURATION
# ------------------------------------------------------------------------------
# List of shares to back up
SHARES_TO_BACKUP=(
  "codebase"
  "assets"
  "domains"               # Triggers Granular folder backups
  "iscsi"                 # Triggers Granular folder backups
  "isos"
  "liz"
  "stroh"
  "sites"
  "mebula"
  "media/Games/saves/"
  "FamilyBackups"          # Triggers Special-hierarchy backups
)
# Exclusions (Associative Array)
declare -A SHARES_EXCLUDE
SHARES_EXCLUDE["isos"]='--exclude "asset-mirror" --exclude "*-squash"'
SHARES_EXCLUDE["iscsi"]='--exclude ".fuse_hidden*"'
# ------------------------------------------------------------------------------
# REMOTE PULL CONFIGURATION
# ------------------------------------------------------------------------------
REMOTE_PULL_SOURCES=(
  "/mnt/remotes/DBACKUPS"
  "/mnt/remotes/KBACKUPS"
)

# ==============================================================================
# WATCHTOWER CONFIGURATION (v7.6+)
# ==============================================================================

# --- STARTUP BEHAVIOR ---
STARTUP_MODE="monitor" # Default mode if no args provided (monitor, scan, cleanup)

# --- GLOBAL PATHS (Watchtower) ---
WATCH_DIR="/mnt/user/backup"
CHECKSUM_DIR=".checksums"
MAIN_BACKUP_SCRIPT="/boot/config/plugins/user.scripts/scripts/Auto-Backupper/script"
# LOGFILE (Watchtower specific)
WATCHTOWER_LOGFILE="/var/log/auto_backupper_watchtower.log"

# --- CACHE WATCHTOWER SETTINGS ---
ENABLE_CACHE_MONITOR=true
CACHE_DIR="/mnt/cache"         
MOVER_TYPE="unraid"            
ARRAY_BASE_PATH="/mnt/user"    
CACHE_THRESHOLD=73             
CACHE_CRITICAL=90              
FORCE_MOVER_ON_CRITICAL=false  
RUN_MOVER_DURING_PARITY=false  

# --- WATCHTOWER SETTINGS ---
MONITOR_INTERVAL=60            
ENABLE_VERIFICATION=false      # Global toggle. If true, ALL scans verify. (Keep false)

# --- SCHEDULER: BACKUP (Executes external backup script) ---
BACKUP_SCHEDULER_ENABLE=true
BACKUP_SCHEDULER_MODE="monthly"
BACKUP_SCHEDULER_VALUE="16"
BACKUP_SCHEDULER_TIME="02:00"

# --- SCHEDULER: CLEANUP (Removes junk/tmp files) ---
CLEANUP_SCHEDULER_ENABLE=true
CLEANUP_SCHEDULER_MODE="daily"
CLEANUP_SCHEDULER_VALUE="Sun"   # Ignored if mode is daily
CLEANUP_SCHEDULER_TIME="04:00"

# --- SCHEDULER: VERIFY (Deep Bitrot Check - High I/O) ---
VERIFY_SCHEDULER_ENABLE=true
VERIFY_SCHEDULER_MODE="monthly"
VERIFY_SCHEDULER_VALUE="28"
VERIFY_SCHEDULER_TIME="03:00"

# --- LOCK FILES ---
BACKUP_LOCKFILE="/var/lock/auto_backupper.lock"