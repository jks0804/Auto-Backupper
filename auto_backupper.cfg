# ==============================================================================
# AUTO-BACKUPPER CONFIGURATION (V8.0 Production)
# ==============================================================================
# Save location: /boot/config/auto_backupper.cfg
# This file is loaded by auto_backupper.sh AND auto_backupper_watchtower.sh

# ==============================================================================
# 1. GENERAL EXECUTION SETTINGS
# ==============================================================================

# "produce" = Create local backups
# "pull"    = Sync from remote (Additive only)
# "both"    = Produce then Pull
MODE="both"

# "all" = Use all cores
# "1"   = Disable Multi-threading (gzip)
# "4"   = Limit to 4 threads (pigz -p 4)
CPU_THREADS="all"

# Set to "false" for actual execution. "true" logs actions without doing them.
DRY_RUN="false"

# Lock file location
BACKUP_LOCKFILE="/var/lock/auto_backupper.lock"

# ==============================================================================
# 2. SYSTEM & BACKUP PATHS
# ==============================================================================

BACKUP_BASE="/mnt/user/backup"
SHARES_BASE_FOLDER="/mnt/user"
SYSTEM_APPDATA_PATH="/mnt/cache/appdata"
SYSTEM_BOOT_PATH="/boot"

# --- OMV / MIGRATION ---
# If set, this folder is rsynced INSTEAD of tarring SYSTEM_APPDATA_PATH.
# Useful for migrating data from OpenMediaVault.
OMV_DOCKER_BACKUP_PATH=""

# ==============================================================================
# 3. DOCKER BACKUP STRATEGY
# ==============================================================================

# "auto"           : Detects OS (Unraid vs Standard Linux).
# "unraid_service" : Uses /etc/rc.d/rc.docker (Stop -> Wait -> Unmount Img -> Force Stop).
# "container"      : Stops specific running containers (Stop -> Wait -> Kill).
# "disabled"       : Backups run "hot" (Risk of database inconsistency).
DOCKER_MODE="unraid_service"
DOCKER_STOP_TIMEOUT=120

# --- UNRAID SPECIFIC ---
# Should we read Unraid's official /boot/config/docker.cfg? (Recommended: true)
USE_UNRAID_DOCKER_CFG=true
UNRAID_DOCKER_CFG="/boot/config/docker.cfg"

# Should the docker.img file be included in the system backup?
BACKUP_DOCKER_IMG=true

# Fallback values if docker.cfg is unreadable/missing
DOCKER_IMG_PATH="/mnt/cache/system/docker/docker.img"
DOCKER_IMG_SIZE="100" # Size in GB (used for mounting logic)

# ==============================================================================
# 4. DATABASE BACKUP SETTINGS
# ==============================================================================
# NOTE: Passwords should be kept secure. Ensure this file has restricted permissions (chmod 600).

# --- SQL (MariaDB/MySQL/Postgres) ---
BACKUP_SQL=false
SQL_TYPE="mysql"              # 'mysql' or 'postgres'
SQL_CONTAINER_NAME="mariadb"  # Container Name (leave empty to use Host IP)
SQL_HOST="172.18.0.4"         # Host IP (used if Container Name is empty)
SQL_USER="root"
SQL_PASS="YOUR_SECURE_PASSWORD"
SQL_DATABASES=()              # Leave empty for ALL databases

# --- Mongo ---
BACKUP_MONGO=false
MONGO_CONTAINER_NAME="mongodb"
MONGO_USER="root"
MONGO_PASS="YOUR_SECURE_PASSWORD"
MONGO_AUTH_DB="admin"
MONGO_DATABASES=()

# --- Redis ---
BACKUP_REDIS=false
REDIS_CONTAINER_NAME="redis"
REDIS_PASS=""

# ==============================================================================
# 5. SHARES & RETENTION
# ==============================================================================

# --- TOGGLES ---
BACKUP_SYSTEM=true
BACKUP_SHARES=true

# --- RETENTION ---
ROTATE_DAYS=90                 # Days to keep files (0 = forever)
VERIFY_LOCAL_BACKUPS=true      # Checksum verify immediately after create
VERIFY_PULLED_BACKUPS=true     # Checksum verify after remote pull

# --- SHARES LIST ---
SHARES_TO_BACKUP=(
  "codebase"
  "assets"
  "domains"                # Recursive: Backs up subfolders as individual archives
  "iscsi"                  # Recursive: Backs up subfolders as individual archives
  "isos"
  "liz"
  "stroh"
  "sites"
  "mebula"
  "media/Games/saves/"
  "FamilyBackups"          # Special Hierarchy: Backs up User/System folders inside
)

# --- EXCLUSIONS ---
declare -A SHARES_EXCLUDE
SHARES_EXCLUDE["isos"]='--exclude "asset-mirror" --exclude "*-squash"'
SHARES_EXCLUDE["iscsi"]='--exclude ".fuse_hidden*"'

# --- REMOTE SOURCES (PULL) ---
REMOTE_PULL_SOURCES=(
  "/mnt/remotes/DBACKUPS"
  "/mnt/remotes/KBACKUPS"
)

# ==============================================================================
# 6. WATCHTOWER: GENERAL SETTINGS
# ==============================================================================

# Default startup mode if no args provided (monitor, scan, cleanup, update)
STARTUP_MODE="monitor"

# How often to check schedules (seconds)
MONITOR_INTERVAL=60

# Paths
WATCH_DIR="/mnt/user/backup"
CHECKSUM_DIR=".checksums"
WATCHTOWER_LOGFILE="/var/log/auto_backupper_watchtower.log"

# Script to trigger when schedule hits (The main worker script)
MAIN_BACKUP_SCRIPT="/boot/config/plugins/user.scripts/scripts/Auto-Backupper/script"

# Path to auto-restorer.sh, used by `watchtower.sh --hub` for List / Verify /
# Inspect / Corruption-report shortcuts. Optional: when blank the hub
# auto-detects a sibling install next to MAIN_BACKUP_SCRIPT (e.g.
# `.../Auto-Restorer/script`, `.../auto-restorer.sh`, `/usr/local/bin/...`).
# Set it explicitly only when your layout differs.
MAIN_RESTORER_SCRIPT=""

# Log Rotation Defaults
LOG_MAX_SIZE="$((10 * 1024 * 1024))"  # 10MB in bytes
LOG_BACKUPS=5                         # Number of old logs to keep

# --- Remote-Webhook Notifications (optional) ---
# When NOTIFY_WEBHOOK_URL is set, auto-backupper.sh and watchtower.sh POST
# a notification to it for every send_notify event (backup start/finish,
# corruption, scheduler errors, etc.) IN ADDITION to the OS-native
# notification (Unraid banner / OMV / notify-send). Off by default.
#
# Format is auto-detected from the URL:
#   discord.com / discordapp.com  -> {"username":..., "content":...}
#   slack.com   / slack-edge.com  -> {"text":...}
#   anything else                 -> {"host","level","title","message","timestamp"}
# Override the format explicitly via NOTIFY_WEBHOOK_FORMAT below. The
# special value "ntfy" sends as plain body + Title/Priority/Tags headers
# (ntfy.sh convention) and must be set explicitly because the URL host
# is user-defined.
NOTIFY_WEBHOOK_URL=""
# NOTIFY_WEBHOOK_FORMAT="discord"   # discord | slack | ntfy | generic

# --- Optional Live Dashboard (--ab-graph) ---
# Polling interval (seconds) for `watchtower.sh --ab-graph`, the live
# full-terminal dashboard that visualises an in-progress auto-backupper
# or auto-restorer run. Lower = snappier sparklines + faster response to
# 'q' quit, but more CPU spent re-rendering. 1 is a good default; 2-3 is
# fine on slow hosts. Must be a positive integer.
WATCHTOWER_GRAPH_REFRESH=1

# ==============================================================================
# 7. WATCHTOWER: CACHE MONITOR
# ==============================================================================

ENABLE_CACHE_MONITOR=true
CACHE_DIR="/mnt/cache"
MOVER_TYPE="unraid"             # "unraid" (invokes /usr/local/sbin/mover) or "internal"
ARRAY_BASE_PATH="/mnt/user"

CACHE_THRESHOLD=73              # Run mover if cache > 73%
CACHE_CRITICAL=90               # Alert if cache > 90%
FORCE_MOVER_ON_CRITICAL=false   # Force mover even if backup is running?
RUN_MOVER_DURING_PARITY=false

# ==============================================================================
# 8. WATCHTOWER: SCHEDULERS
# ==============================================================================
# Modes: daily, weekly, monthly, quarterly, annually

# --- BACKUP SCHEDULER ---
BACKUP_SCHEDULER_ENABLE=true
BACKUP_SCHEDULER_MODE="monthly"
BACKUP_SCHEDULER_VALUE="16"     # Day of month (16) or Day of Week (Sun)
BACKUP_SCHEDULER_TIME="02:00"

# --- CLEANUP SCHEDULER ---
# Removes .DS_Store, .tmp, and rogue .nfo files
CLEANUP_SCHEDULER_ENABLE=true
CLEANUP_SCHEDULER_MODE="daily"
CLEANUP_SCHEDULER_VALUE="Sun"   # Ignored if mode is daily
CLEANUP_SCHEDULER_TIME="04:00"

# --- VERIFY SCHEDULER ---
# Deep checksum verification of ALL backup files (High I/O)
VERIFY_SCHEDULER_ENABLE=true
VERIFY_SCHEDULER_MODE="monthly"
VERIFY_SCHEDULER_VALUE="28"
VERIFY_SCHEDULER_TIME="03:00"

# --- DOCKER UPDATER SCHEDULER ---
# Automatically checks for updates, pulls images, and restarts containers.
# NOTE: Only restarts if a new image hash is detected.
UPDATE_SCHEDULER_ENABLE=true
UPDATE_SCHEDULER_MODE="weekly"
UPDATE_SCHEDULER_VALUE="Sat"
UPDATE_SCHEDULER_TIME="05:00"

# Space-separated list of containers to NEVER update automatically.
DOCKER_UPDATE_EXCLUDE="mariadb mongodb"

# ==============================================================================
# 9. WATCHTOWER: DOCKER CONTAINER RECOVERY  (Unraid)
# ==============================================================================
# Repairs "ghost" containers after a reboot — the ones whose config survives
# but whose writable layer is gone ("RWLayer is unexpectedly nil" / "name
# already in use"), so they can't start, only be removed and recreated. While a
# container is healthy the daemon refreshes a recovery recipe (its exact
# docker run, captured from `docker inspect`); on (re)boot and on an interval it
# tries `docker start` first and, only if that fails, removes and recreates the
# container with its Unraid GUI labels intact. A true ghost can't be inspected,
# so the blueprint comes from the saved recipe or — for a container never seen
# healthy (no recipe) — the container's Unraid template, parsed with php (ships
# with Unraid; without it that one fallback is skipped). App data lives in
# bind-mounted appdata, which is NEVER touched. Discovery keys off Unraid user
# templates, so this is a no-op on non-Unraid hosts.
#
# IMPORTANT: recovery only ever brings back a container that is SUPPOSED to be
# running, and never starts one you intentionally keep stopped — see
# DOCKER_RECOVERY_DETECT below for how that's decided.

DOCKER_RECOVERY_ENABLE=false

# How recovery decides a non-running container should be brought back:
#   autostart — (recommended) recover anything Unraid is set to autostart that
#               isn't running. The autostart list lives on the host, so this
#               catches stopped, errored AND completely missing (orphaned)
#               containers, while leaving autostart-OFF containers (the ones you
#               deliberately stopped) untouched.
#   states    — recover only containers whose docker state is in
#               DOCKER_RECOVERY_GHOST_STATES; ignore autostart.
DOCKER_RECOVERY_DETECT="autostart"

# Unraid's autostart list, read in "autostart" mode (one managed container name
# per line). It lives on the host, so it's readable even when a container's
# record is gone — that's what lets recovery catch orphaned/missing containers.
# Override if your Unraid version stores it elsewhere; the recovery log prints
# how many containers it found so you can confirm the path is right.
DOCKER_AUTOSTART_FILE="/var/lib/docker/unraid-autostart"

# Run a recovery pass when the daemon starts (catches ghosts right after a
# reboot / array start). Recommended: true.
DOCKER_RECOVERY_RUN_ON_STARTUP=true

# Seconds between periodic recovery passes while the daemon runs. The passes
# keep each healthy container's recipe fresh and catch ghosts that appear
# later. 3600 = hourly. Set 0 to only run on startup.
DOCKER_RECOVERY_INTERVAL=3600

# Safety valve: only ever try `docker start`; never remove/recreate. Recovery
# will instead log which containers need a manual template re-apply.
DOCKER_RECOVERY_NO_RECREATE=false

# Log the planned `docker run` for each ghost but change nothing (good for a
# first deploy). `watchtower.sh --recover --dry-run` sets this for a one-off run.
DOCKER_RECOVERY_DRYRUN=false

# Used by DOCKER_RECOVERY_DETECT=states, and as the fallback when the autostart
# list can't be read. Space-separated docker states that count as a broken
# "ghost"; a non-running container in ANY other state (notably a clean "exited")
# is left untouched as intentionally stopped.
DOCKER_RECOVERY_GHOST_STATES="created dead restarting"

# Extra detection on top of the above: also recover a MISSING container (one with
# no docker record at all) when its template's image is still present on disk
# (Unraid's "orphan image") — regardless of autostart. The leftover image is
# treated as proof the container was installed and has since vanished. Only ever
# fires for missing containers (a stopped one still references its image, so it
# never looks orphaned), so it cannot start something you deliberately stopped.
# Set false to make recovery strictly autostart/state-driven.
DOCKER_RECOVERY_USE_ORPHAN_IMAGES=true

# Where Unraid stores per-container templates (used to discover managed
# containers). The Unraid default is correct for almost everyone.
DOCKER_TEMPLATE_DIR="/boot/config/plugins/dockerMan/templates-user"

# Where the reconstructed recovery recipes are persisted. Must survive reboots
# and be readable before the array starts, so it lives on the flash by default.
DOCKER_RECOVERY_DIR="/boot/config/ab_recovery"